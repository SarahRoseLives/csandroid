plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cspsp.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.cspsp.android"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.92b"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti -Wno-write-strings -Wno-narrowing'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // Game assets are kept under jge/Projects/cspsp/bin
            assets.srcDirs = ['../../jge/Projects/cspsp/bin']
            java.srcDirs = ['src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion '27.0.12077973'
}
